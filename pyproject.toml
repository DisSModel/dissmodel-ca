[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dissmodel-ca"
version = "0.1.0"
description = "Cellular Automata examples and library for dissmodel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dissmodel",
    "libpysal",
    "numpy",
    "geopandas",
    "matplotlib",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["src"]
